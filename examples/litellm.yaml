# LiteLLM gateway excerpt: the normal alias and the opt-in big-document alias both go through the
# handoff proxy (:8002); if the proxy is down, the fallbacks send them to Sushi (:8000) directly.
model_list:
  - model_name: qwen38-flash
    litellm_params:
      model: openai/qwen3.8-flash-next
      api_base: http://localhost:8002/v1
      api_key: "EMPTY"
      timeout: 4200
      temperature: 0.7
      top_p: 0.8
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs: {enable_thinking: false}
  # Every alias through the proxy hands off at >= 5,000 uncached tokens; the bigdoc aliases are kept for clients
  # that name them. Thinking on or off.
  # Sushi reads reasoning_effort only at the top level (inside chat_template_kwargs it is ignored and
  # thinking runs at low), so a thinking alias sends it at the top level of extra_body.
  - model_name: qwen38-flash-bigdoc
    litellm_params:
      model: openai/qwen38-flash-bigdoc
      api_base: http://localhost:8002/v1
      api_key: "EMPTY"
      # No retries: a retry resends the whole document and can start a second handoff.
      num_retries: 0
      timeout: 4200
      temperature: 0.7
      top_p: 0.8
      extra_body:
        top_k: 20
        min_p: 0
        chat_template_kwargs: {enable_thinking: false}
  - model_name: qwen38-flash-bigdoc-think
    litellm_params:
      model: openai/qwen38-flash-bigdoc-think
      api_base: http://localhost:8002/v1
      api_key: "EMPTY"
      num_retries: 0
      timeout: 4200
      extra_body:
        reasoning_effort: medium
        chat_template_kwargs: {enable_thinking: true, reasoning_effort: medium}
  - model_name: qwen38-flash-direct
    litellm_params:
      model: openai/qwen3.8-flash-next
      api_base: http://localhost:8000/v1
      api_key: "EMPTY"
      timeout: 4200
  - model_name: qwen38-flash-think-direct
    litellm_params:
      model: openai/qwen3.8-flash-next
      api_base: http://localhost:8000/v1
      api_key: "EMPTY"
      timeout: 4200
      extra_body:
        reasoning_effort: medium
        chat_template_kwargs: {enable_thinking: true, reasoning_effort: medium}

router_settings:
  fallbacks:
    - qwen38-flash: [qwen38-flash-direct]
    - qwen38-flash-bigdoc: [qwen38-flash-direct]
    - qwen38-flash-bigdoc-think: [qwen38-flash-think-direct]
